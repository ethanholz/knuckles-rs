when:
  - event: ["push", "manual"]
    branch: ["main"]
engine: "pixi"

pixi:
  environment: "ci"

clone:
  skip: false
  depth: 1
  submodules: false

steps:
  - name: "Test"
    command: "cargo llvm-cov nextest --lcov --output-path lcov.info"
  - name: "Build"
    command: "cargo build --release"
