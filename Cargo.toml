[workspace]
members = [ "knuckles-macro","knuckles-parse", "knuckles-toolkit"]
resolver = "2"

[workspace.package]
version = "0.2.2"
description = "A tooklkit for parsing PDB records"
authors = ["Ethan Holz"]
license = "MIT"
readme = "README.md"
repository = "https://tangled.org/ethanholz.com/knuckles-rs"


[workspace.dependencies]
rayon = { version = "1.8.1"}
serde = { version = "1.0.195", features = ["derive"]}
serde_json = {version = "1.0.111"}
